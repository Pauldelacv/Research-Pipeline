name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose: package.json's `packageManager` field is
      # the single source of truth. Specifying both makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests need no services: the pipeline runs against in-memory stores.
      - run: pnpm test

  build:
    name: Build applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frp/api build
      - run: pnpm --filter @frp/worker build
      - run: pnpm --filter @frp/web build

  e2e:
    name: End-to-end (mock providers)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frp
          POSTGRES_PASSWORD: frp
          POSTGRES_DB: frp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frp" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://frp:frp@localhost:5432/frp
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      EXPORT_DIR: ${{ github.workspace }}/var/exports
      # Deterministic providers keep the end-to-end run from flaking on
      # simulated failures; the retry path has its own unit tests.
      MOCK_DETERMINISTIC: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Filtered to @frp/web because that is the package @playwright/test is a
      # dependency of. `pnpm exec` at the workspace root only sees the root's
      # own node_modules/.bin, which holds no playwright, so this step failed
      # with 'Command "playwright" not found'. Filtering also pins the binary
      # to the version in the lockfile rather than whatever copy is on PATH.
      - run: pnpm --filter @frp/web exec playwright install --with-deps chromium

      - run: pnpm db:migrate
      - run: pnpm seed
      - run: pnpm --filter @frp/web build

      - name: Start the stack
        run: |
          pnpm dev:api > /tmp/api.log 2>&1 &
          pnpm dev:worker > /tmp/worker.log 2>&1 &
          pnpm --filter @frp/web start > /tmp/web.log 2>&1 &

          # Polled with curl rather than `npx wait-on`: wait-on is in no
          # package.json and no lockfile, so npx fetched an unpinned copy from
          # the registry on every run — a network dependency in the middle of
          # the job, and a silent version bump waiting to happen.
          wait_for() {
            local url=$1 attempt=0
            until curl -fsS -o /dev/null --max-time 5 "$url" 2>/dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 90 ]; then
                echo "::error::$url did not come up within 90s"
                return 1
              fi
              sleep 1
            done
            echo "$url is up"
          }

          wait_for http://localhost:4000/health
          wait_for http://localhost:3000

      - run: pnpm test:e2e

      # Tolerant of missing logs on purpose: a failure before "Start the stack"
      # leaves these files unwritten, and a bare `tail` then fails too, adding a
      # second red step that draws attention away from the real one.
      - name: Service logs on failure
        if: failure()
        run: |
          for log in /tmp/api.log /tmp/worker.log /tmp/web.log; do
            echo "===== $log ====="
            tail -n 100 "$log" 2>/dev/null || echo '(not written: the stack never started)'
          done

      # test-results/ carries the traces and screenshots (retain-on-failure);
      # playwright-report/ is the browsable HTML summary.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
